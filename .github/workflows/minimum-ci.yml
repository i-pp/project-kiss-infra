# Added 2026-11-12: always-run, offline minimum CI; not hardware or release acceptance.

name: Minimum source CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum:
    name: Minimum source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked Python, JSON and shell syntax
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import ast
          import json
          import pathlib
          import subprocess

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          checked = 0
          for name in filter(None, paths):
              path = pathlib.Path(name)
              if path.suffix == '.py':
                  ast.parse(path.read_bytes(), filename=name)
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
              elif path.suffix == '.sh':
                  subprocess.run(['bash', '-n', name], check=True)
              else:
                  continue
              checked += 1
          if not checked:
              raise SystemExit('No source files checked')
          print(f'Syntax checked: {checked} files')
          PYCODE
      - name: Run offline service and workspace regressions
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import sys
          import unittest

          # These suites use fake backends, private sockets and owned test processes.
          # They do not load models, access devices or start Docker containers.
          modules = [
              'inference.aceis_npu_service.tests.test_service',
              'inference.aceis_service.test_service',
              'inference.aceis_service.test_npu_bridge',
              'inference.local_platform.test_cli',
              'inference.local_platform.test_developer',
              'inference.local_platform.test_project_runner',
              'inference.local_platform.test_repair',
              'inference.local_platform.test_workspace',
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          planned = suite.countTestCases()
          if not planned:
              raise SystemExit('Empty test suite')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (result.wasSuccessful() and result.testsRun == planned
                    and not result.skipped and not result.expectedFailures
                    and not result.unexpectedSuccesses)
          sys.exit(0 if passed else 1)
          PYCODE
