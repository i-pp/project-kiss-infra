name: project-kiss-dev
services:
  dev:
    image: ${DEV_IMAGE:?use scripts/dev-aarch64.sh}
    pull_policy: never
    environment:
      CARGO_HOME: /work/cargo-home
    user: "${LOCAL_UID:?}:${LOCAL_GID:?}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    ulimits:
      core: 0
      fsize: 134217728
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=268435456,mode=1777
    volumes:
      - ${DEV_ROOT:?}/dev/aarch64:/src/dev/aarch64:ro
      - ${DEV_ROOT:?}/scripts/test-dev-aarch64.py:/src/scripts/test-dev-aarch64.py:ro
      - ${DEV_ROOT:?}/.cache/dev-aarch64:/work:rw
      - ${DEV_ROOT:?}/logs/dev-aarch64:/logs:rw
    logging:
      driver: local
      options:
        max-size: 2m
        max-file: "2"
